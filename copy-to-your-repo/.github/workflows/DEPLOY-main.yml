name: DEPLOY-main

# Stage-per-environment deployment workflow.
#
# Keep this simple:
#   1. Add one deploy-* job per environment.
#   2. For each higher stage set `needs` to the previous stage.
#   3. This template defaults to `environment-approval`:
#      - keep `promotion-mode: environment-approval` on every stage.
#      - keep the `repository_dispatch` trigger enabled.
#      - configure GitHub environment protection rules for approvals.
#   4. To switch to `manual-gate-tag` (GitHub Free compatible):
#      - change `promotion-mode` on every stage.
#      - remove the `repository_dispatch` trigger.
#      - make `target-environment` a required choice input again.
#      - change each stage condition to the manual `workflow_dispatch` form.
#
# See docs/setup/github-setup.md

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0} <- {1}', github.event.inputs['target-environment'] || 'auto', github.event.inputs['build-run-name'] || format('latest from {0}', github.ref_name)) || format('Deploy auto <- run {0}', github.run_id) }}

permissions:
  actions: read
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      build-run-name:
        description: 'Optional exact BUILD name to deploy. Leave blank to use the latest successful BUILD from this branch. Numeric run IDs also work.'
        required: false
        type: string
      target-environment:
        description: 'Optional target environment. Leave blank to start from TEST-main or set a specific stage.'
        required: false
        type: string
        # For manual-gate-tag, make this required, change the type to choice,
        # and restore TEST-main/PROD as the options.
  repository_dispatch:
    types: [alm4dataverse-build-deploy-main]

jobs:
  deploy-test:
    # First stage in the chain.
    # Starts automatically from BUILD or can be replayed manually.
    if: >-
      (
        github.event_name == 'repository_dispatch' &&
        github.event.client_payload.branch == 'main'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.target-environment == 'TEST-main' ||
          inputs.target-environment == ''
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: TEST-main
    concurrency:
      group: alm4dataverse-environment-TEST-main
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Deploy to TEST-main
        uses: ALM4Dataverse/ALM4Dataverse/.github/actions/deploy@main
        with:
          environment-name: TEST-main
          previous-environment-name: ''
          promotion-mode: environment-approval
          trigger-branch: main
          github-context-json: ${{ toJSON(github) }}
          caller-inputs-json: ${{ toJSON(inputs) }}
          all-repo-vars-json: ${{ toJSON(vars) }}
          all-repo-secrets-json: ${{ toJSON(secrets) }}

  deploy-prod:
    # Higher stage example.
    # Allow manual targeted deploys even when prior jobs are skipped in this run,
    # but do not bypass failed prerequisite stages on automatic runs.
    needs: deploy-test
    if: >-
      (
        github.event_name == 'repository_dispatch' &&
        github.event.client_payload.branch == 'main' &&
        needs['deploy-test'].result == 'success'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.target-environment == 'PROD' ||
          (inputs.target-environment == '' && needs['deploy-test'].result == 'success')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: PROD
    concurrency:
      group: alm4dataverse-environment-PROD
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Deploy to PROD
        uses: ALM4Dataverse/ALM4Dataverse/.github/actions/deploy@main
        with:
          environment-name: PROD
          previous-environment-name: TEST-main
          promotion-mode: environment-approval
          trigger-branch: main
          github-context-json: ${{ toJSON(github) }}
          caller-inputs-json: ${{ toJSON(inputs) }}
          all-repo-vars-json: ${{ toJSON(vars) }}
          all-repo-secrets-json: ${{ toJSON(secrets) }}
