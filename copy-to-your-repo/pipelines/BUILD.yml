trigger:
  branches:
    include:
    - '*'  # Support any branch name

# The alias is consumed by shared templates and must match their second checkout.
resources:
  repositories:
    - repository: ALM4Dataverse
      type: git
      name: ALM4Dataverse

stages:
- template: pipelines/templates/build.yml@ALM4Dataverse
  parameters:
    useAlm4DataverseExtension: true
    # Leave empty for packaging only; selecting an environment enables deployment validation.
    buildEnvironmentName: ''