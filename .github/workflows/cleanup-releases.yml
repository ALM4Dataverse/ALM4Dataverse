name: Cleanup deployment releases

# Reusable workflow: remove deployment Releases from deleted branches and cap
# the number of Releases retained per source branch. Durable metadata tags are
# written before deletion so fallback deployments retain branch/build identity.

on:
  workflow_call:
    inputs:
      max-releases-per-branch:
        required: false
        type: number
        default: 10
        description: 'Keep at most this many newest build Releases per source branch.'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete deleted-branch and excess releases
        uses: actions/github-script@v7
        env:
          MAX_RELEASES_PER_BRANCH: ${{ inputs.max-releases-per-branch }}
        with:
          script: |
            const maxReleasesPerBranch = Number(process.env.MAX_RELEASES_PER_BRANCH || '10');
            if (!Number.isInteger(maxReleasesPerBranch) || maxReleasesPerBranch < 1) {
              throw new Error(`MAX_RELEASES_PER_BRANCH must be a positive integer; received '${process.env.MAX_RELEASES_PER_BRANCH}'.`);
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchCache = new Map();

            function getBuildMetadata(release) {
              const body = String(release.body || '');
              const marker = body.match(/<!--\s*alm4dataverse-build-branch:([^\s]+)\s*-->/i);
              if (!marker) return null;

              let branchName;
              try { branchName = decodeURIComponent(marker[1]); } catch { return null; }

              const buildMatch = body.match(/^Build:\s*(?<buildName>[^\r\n]+)\s*$/im);
              const sourceCommitMatch = body.match(/^Source commit:\s*(?<sourceCommit>[0-9a-f]{40})\s*$/im);
              const runMatch = body.match(/^BUILD run:\s*\[(?<runId>\d+)\]\s*\(/im);
              if (!buildMatch || !sourceCommitMatch || !runMatch || !branchName) return null;

              return {
                branch: branchName.trim(),
                buildName: buildMatch.groups.buildName.trim(),
                sourceCommit: sourceCommitMatch.groups.sourceCommit,
                runId: runMatch.groups.runId,
              };
            }

            function getReleaseBranch(release) {
              const metadata = getBuildMetadata(release);
              return metadata ? metadata.branch : null;
            }

            async function ensureMetadataTag(release) {
              const metadata = getBuildMetadata(release);
              if (!metadata) {
                throw new Error(`Release '${release.tag_name}' is missing complete ALM build metadata; refusing to delete it.`);
              }

              const metadataTagName = `alm4dataverse/metadata/${release.tag_name}`;
              let existingRef = null;
              try {
                existingRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${metadataTagName}` });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (existingRef) return metadataTagName;

              const tagObject = await github.rest.git.createTag({
                owner,
                repo,
                tag: metadataTagName,
                message: [
                  'ALM4Dataverse build metadata',
                  `Build: ${metadata.buildName}`,
                  `Branch: ${metadata.branch}`,
                  `Source commit: ${metadata.sourceCommit}`,
                  `BUILD run: ${metadata.runId}`,
                  `Release tag: ${release.tag_name}`,
                ].join('\n'),
                object: metadata.sourceCommit,
                type: 'commit',
              });

              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${metadataTagName}`, sha: tagObject.data.sha });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              return metadataTagName;
            }

            async function branchExists(branchName) {
              if (branchCache.has(branchName)) return branchCache.get(branchName);
              let exists = true;
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: branchName });
              } catch (error) {
                if (error.status === 404) exists = false; else throw error;
              }
              branchCache.set(branchName, exists);
              return exists;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const releasesByBranch = new Map();
            for (const release of releases) {
              const branchName = getReleaseBranch(release);
              if (!branchName) continue;
              if (!releasesByBranch.has(branchName)) releasesByBranch.set(branchName, []);
              releasesByBranch.get(branchName).push(release);
            }

            let deletedCount = 0;
            for (const [branchName, branchReleases] of releasesByBranch) {
              const isOrphaned = !(await branchExists(branchName));
              const releasesToDelete = isOrphaned
                ? branchReleases
                : branchReleases.slice().sort((left, right) => {
                    const leftDate = Date.parse(left.published_at || left.created_at || '');
                    const rightDate = Date.parse(right.published_at || right.created_at || '');
                    const dateDifference = (Number.isFinite(rightDate) ? rightDate : 0) - (Number.isFinite(leftDate) ? leftDate : 0);
                    return dateDifference !== 0 ? dateDifference : Number(right.id || 0) - Number(left.id || 0);
                  }).slice(maxReleasesPerBranch);

              for (const release of releasesToDelete) {
                const metadataTagName = await ensureMetadataTag(release);
                await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
                deletedCount++;
                const reason = isOrphaned ? 'source branch deleted' : `more than ${maxReleasesPerBranch} Releases retained for branch '${branchName}'`;
                core.info(`Deleted Release '${release.tag_name}' (${reason}); retained metadata tag '${metadataTagName}'.`);
              }
            }

            core.info(`Release cleanup completed. Deleted ${deletedCount} Release(s).`);
