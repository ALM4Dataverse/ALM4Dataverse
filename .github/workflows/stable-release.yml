name: Stable Release

run-name: Stable release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*'
      - '!v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-pushed-tag:
    name: Publish pushed stable tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0

      - name: Checkout shared release implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools
          fetch-depth: 1

      - name: Validate stable tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$') {
            throw "Tag '$($env:RELEASE_TAG)' is not a supported stable version tag."
          }
          "tag_name=$($env:RELEASE_TAG)" >> $env:GITHUB_OUTPUT

      - name: Publish stable release and move stable tag
        uses: ./release-tools/.github/actions/publish-release
        with:
          source-directory: source
          release-tag: ${{ steps.tag.outputs.tag_name }}
          target-sha: ${{ github.sha }}
          prerelease: 'false'
          move-stable: 'true'

  publish-dispatched-stable:
    name: Calculate and publish stable release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0

      - name: Checkout shared release implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools
          fetch-depth: 1

      - name: Require a branch selection
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -ne 'branch') {
            throw 'Run this workflow from a selected branch, not a tag or commit ref.'
          }

      - name: Add current release configuration to selected source
        shell: pwsh
        run: |
          Copy-Item -LiteralPath release-tools/release.config.cjs -Destination source/release.config.cjs -Force

      - name: Preview stable semantic release
        id: preview
        uses: codfish/semantic-release-action@v5.0.0
        with:
          working-directory: source
          branches: ${{ format('[{0}]', toJson(github.ref_name)) }}
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace/source

      - name: Create stable version tag
        id: semantic-release
        if: steps.preview.outputs.new-release-published == 'true'
        uses: codfish/semantic-release-action@v5.0.0
        with:
          working-directory: source
          branches: ${{ format('[{0}]', toJson(github.ref_name)) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace/source

      - name: Publish stable release and move stable tag
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: ./release-tools/.github/actions/publish-release
        with:
          source-directory: source
          release-tag: ${{ steps.semantic-release.outputs.git-tag }}
          target-sha: ${{ steps.semantic-release.outputs.git-head }}
          prerelease: 'false'
          move-stable: 'true'
          release-notes: ${{ steps.semantic-release.outputs.release-notes }}
