name: Copilot Setup Steps

# Prepares the Copilot coding agent's environment before its firewall applies, so it can run
# the checks in AGENTS.md. GitHub runs the job named copilot-setup-steps from the default branch.

'on':
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Import-PowerShellDataFile ./scripts/powershell-validation.psd1
          foreach ($tool in $policy.Tools.GetEnumerator()) {
            Install-Module -Name $tool.Key -RequiredVersion $tool.Value -Repository PSGallery -Scope CurrentUser -Force
          }
