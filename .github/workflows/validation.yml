name: Repository Validation

on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-github-actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml copy-to-your-repo/.github/workflows/*.yml

  validate-powershell:
    name: PowerShell Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Go for generated workflow validation
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install actionlint for generated workflow validation
        if: runner.os == 'Linux'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Set up Node.js for Azure Pipelines schema validation
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install Microsoft Azure Pipelines language service
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/azure-pipelines-validator" --no-audit --no-fund azure-pipelines-language-service@0.9.2
          echo "AZURE_PIPELINES_LANGUAGE_SERVICE=$RUNNER_TEMP/azure-pipelines-validator/node_modules/azure-pipelines-language-service" >> "$GITHUB_ENV"
      - name: Fetch Microsoft Azure Pipelines schema
        if: runner.os == 'Linux'
        run: |
          schema="$RUNNER_TEMP/azure-pipelines-schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/microsoft/azure-pipelines-vscode/9e40e814abd20917f273dd587497086f0476a563/service-schema.json \
            --output "$schema"
          echo "AZURE_PIPELINES_SCHEMA=$schema" >> "$GITHUB_ENV"
      - name: Validate Azure Pipelines against Microsoft schema
        if: runner.os == 'Linux'
        run: |
          # DEPLOY-main.yml is an intentionally empty scaffold; setup-generated deployments are validated in Pester.
          node scripts/validate-azure-pipelines.js \
            --schema "$RUNNER_TEMP/azure-pipelines-schema.json" \
            pipelines \
            copy-to-your-repo/pipelines/BUILD.yml \
            copy-to-your-repo/pipelines/EXPORT.yml \
            copy-to-your-repo/pipelines/IMPORT.yml
      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Import-PowerShellDataFile ./scripts/powershell-validation.psd1
          foreach ($tool in $policy.Tools.GetEnumerator()) {
            Install-Module -Name $tool.Key -RequiredVersion $tool.Value -Repository PSGallery -Scope CurrentUser -Force
          }
      - name: Run PowerShell validation suite
        shell: pwsh
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          COVERAGE_HEAD_REF: ${{ github.sha }}
          ACTIONLINT_REQUIRED: ${{ runner.os == 'Linux' }}
          AZURE_PIPELINES_SCHEMA_REQUIRED: ${{ runner.os == 'Linux' }}
        run: ./scripts/Test-PowerShell.ps1 -BaseRef $env:COVERAGE_BASE_REF -HeadRef $env:COVERAGE_HEAD_REF
      - name: Generate setup installers for Windows PowerShell syntax checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./prepare-release.ps1 -TagName v0.0.0-ci -OutputDir "$env:RUNNER_TEMP/setup-syntax"
      - name: Parse setup installers with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem "$env:RUNNER_TEMP/setup-syntax" -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Publish test and coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  required-validation:
    name: Validation Required
    if: always()
    needs: [validate-powershell, validate-github-actions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          POWERSHELL_RESULT: ${{ needs.validate-powershell.result }}
          GITHUB_ACTIONS_RESULT: ${{ needs.validate-github-actions.result }}
        run: |
          test "$POWERSHELL_RESULT" = success
          test "$GITHUB_ACTIONS_RESULT" = success