# The caller owns job permissions: publishing tags/Releases and dispatching requires
# contents:write; Azure OIDC also requires id-token:write when validation is enabled.
name: Build
description: Build, validate, optionally deploy a baseline and candidate to the validation environment, publish, and tag Dataverse solution artifacts.

inputs:
  build-name:
    description: Exact build name used for the run and source tag.
    required: true
  source-ref:
    description: Optional source branch or commit to build.
    required: false
    default: ''
  source-branch:
    description: Optional source branch used for downstream repository_dispatch payloads.
    required: false
    default: ''
  environment-name:
    description: Optional GitHub environment used to authenticate and deploy the baseline and candidate artifacts for deployment validation.
    required: false
    default: ''
  vars-json:
    description: JSON representation of the caller repository variables.
    required: false
    default: '{}'
  secrets-json:
    description: JSON object containing only explicitly selected secret values.
    required: false
    default: |-
      {
      }

outputs:
  run-id:
    description: Internal numeric GitHub Actions run ID for this build.
    value: ${{ github.run_id }}
  run-name:
    description: Exact build name used for deployment selection.
    value: ${{ inputs.build-name }}
  build-version:
    description: SemVer prerelease version assigned to this BUILD.
    value: ${{ steps.resolve-version.outputs.version }}
  release-tag:
    description: Git tag used by the GitHub Release for this build.
    value: ${{ steps.tag-source.outputs.tag_name }}
  release-url:
    description: URL of the GitHub Release created for this build.
    value: ${{ steps.create-release.outputs.release_url }}

runs:
  using: composite
  steps:
    # Build the explicitly selected source, not necessarily the caller workflow SHA.
    # Action implementation paths remain github.action_path rather than self/alm.
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
        path: self
        fetch-depth: 1

    # Branch identity drives versioning and downstream dispatch, independently of
    # source-ref checkout. A non-branch workflow ref needs an explicit branch override.
    - name: Resolve SemVer build version
      id: resolve-version
      shell: pwsh
      working-directory: ${{ github.workspace }}/self
      env:
        BUILD_BRANCH: ${{ inputs.source-branch != '' && inputs.source-branch || github.ref_name }}
        BUILD_BRANCH_OVERRIDE: ${{ inputs.source-branch }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        BUILD_RUN_NUMBER: ${{ github.run_number }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:BUILD_BRANCH_OVERRIDE) -and $env:GITHUB_REF_TYPE -ne 'branch') {
          throw "BUILD SemVer requires a branch source; selected ref type is '$($env:GITHUB_REF_TYPE)'."
        }
        . "${{ github.action_path }}/../../../pipelines/scripts/common.ps1"
        $config = Get-AlmConfig -BaseDirectory "${{ github.workspace }}/self" -LogConfig $false
        $version = Resolve-AlmBuildVersion -Config $config -BranchName $env:BUILD_BRANCH -RunNumber $env:BUILD_RUN_NUMBER -Provider github
        "version=$($version.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "tag_name=$($version.TagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "BUILD_VERSION=$($version.Version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "BUILD_TAG=$($version.TagName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Resolved BUILD version $($version.Version)"

    # Keys reflect requested versions (or lock pins); restore never substitutes for
    # installation/import in the build process, particularly with floating selectors.
    - name: Resolve dependency cache keys
      id: dependency-cache
      shell: pwsh
      working-directory: ${{ github.workspace }}/self
      run: |
        & "${{ github.action_path }}/../../../pipelines/scripts/resolvedependencycache.ps1" `
          -BaseDirectory "${{ github.workspace }}/self" `
          -AlmScriptsRoot "${{ github.action_path }}/../../../pipelines/scripts"

    - name: Cache PowerShell modules
      if: steps.dependency-cache.outputs.module_cache_enabled == 'true'
      uses: actions/cache@v4
      with:
        key: ${{ steps.dependency-cache.outputs.module_cache_key }}
        path: |
          ~/.local/share/powershell/Modules

    - name: Cache PAC CLI
      if: steps.dependency-cache.outputs.pac_cache_enabled == 'true'
      uses: actions/cache@v4
      with:
        key: ${{ steps.dependency-cache.outputs.pac_cache_key }}
        path: ~/.alm4dataverse/tools

    # Preserve the caller's exact display name separately from the SemVer Release tag.
    - name: Set build number
      id: build-number
      shell: pwsh
      env:
        BUILD_NAME: ${{ inputs.build-name }}
        BUILD_VERSION: ${{ steps.resolve-version.outputs.version }}
      run: |
        echo "BUILD_NUMBER=$env:BUILD_NAME" >> $env:GITHUB_ENV
        "run_name=$env:BUILD_NAME" >> $env:GITHUB_OUTPUT
        "build_version=$env:BUILD_VERSION" >> $env:GITHUB_OUTPUT
        Write-Host "Exact build name: $env:BUILD_NAME"

    # An empty validation environment skips mapping/login/deployment, not packing
    # or any enabled solution checks. Secrets are restricted to the caller's selection.
    - name: Resolve prefixed repo variables and explicit secrets
      if: inputs.environment-name != ''
      shell: pwsh
      env:
        VARS_JSON: ${{ inputs.vars-json }}
        SELECTED_SECRETS_JSON: ${{ inputs.secrets-json }}
        RESOLVED_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
      run: |
        & "${{ github.action_path }}/../common/resolve-prefixed-env.ps1"

    - name: Validate authentication inputs
      if: inputs.environment-name != ''
      shell: pwsh
      run: |
        & "${{ github.action_path }}/../common/validate-auth.ps1" -RequireServiceAccount

    # No client secret selects OIDC; otherwise the mapper supplies secret credentials.
    # Authentication is subscription-less because the target is Dataverse.
    - name: Log in to Azure with GitHub OIDC
      if: inputs.environment-name != ''
      uses: azure/login@v3
      env:
        AZURE_CORE_OUTPUT: none
      with:
        client-id: ${{ env.AZURE_CLIENT_SECRET == '' && env.AZURE_CLIENT_ID || '' }}
        tenant-id: ${{ env.AZURE_CLIENT_SECRET == '' && env.AZURE_TENANT_ID || '' }}
        creds: ${{ env.ALM_AZURE_CREDENTIALS || '' }}
        allow-no-subscriptions: true

    # Keep module installation, connection, build and validation in one pwsh process:
    # loaded modules/default Dataverse connection cannot cross action step boundaries.
    # Metadata records checked-out HEAD, while connection-reference JSON becomes
    # per-reference process variables before baseline-then-candidate deployment.
    - name: Build artifacts and validate deployment
      shell: pwsh
      working-directory: ${{ github.workspace }}/self
      env:
        BUILD_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        GITHUB_TOKEN: ${{ github.token }}
        BUILD_BRANCH: ${{ inputs.source-branch != '' && inputs.source-branch || github.ref_name }}
        BUILD_RUN_NUMBER: ${{ github.run_number }}
      run: |
        $ErrorActionPreference = 'Stop'
        & "${{ github.action_path }}/../../../pipelines/scripts/installdependencies.ps1"
        if (-not [string]::IsNullOrWhiteSpace($env:BUILD_ENVIRONMENT_NAME)) {
          & "${{ github.action_path }}/../../../pipelines/scripts/connect.ps1" -Url $env:DATAVERSE_URL
        }
        & "${{ github.action_path }}/../../../pipelines/scripts/build.ps1" `
          -SourceDirectory "${{ github.workspace }}/self" `
          -ArtifactStagingDirectory "${{ github.workspace }}/artifacts"
        . "${{ github.action_path }}/../../../pipelines/scripts/common.ps1"
        $config = Get-AlmConfig -BaseDirectory "${{ github.workspace }}/self" -LogConfig $false
        $version = Resolve-AlmBuildVersion -Config $config -BranchName $env:BUILD_BRANCH -RunNumber '${{ github.run_number }}' -Provider github
        Write-AlmBuildVersionInfo `
          -ArtifactsPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts') `
          -BuildVersion $version `
          -RunId '${{ github.run_id }}' `
          -SourceCommit (git rev-parse HEAD).Trim()

        if (-not [string]::IsNullOrWhiteSpace($env:BUILD_ENVIRONMENT_NAME)) {
          if (-not [string]::IsNullOrWhiteSpace($env:DATAVERSE_CONNECTION_REFS)) {
            $connRefs = $env:DATAVERSE_CONNECTION_REFS | ConvertFrom-Json
            foreach ($prop in $connRefs.PSObject.Properties) {
              [System.Environment]::SetEnvironmentVariable("DataverseConnRef_$($prop.Name)", $prop.Value)
            }
          }

          Write-Host '##[group]Deploying build artifacts to the BUILD validation environment'
          $artifactsPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          & "${{ github.action_path }}/../common/deploy-build-validation.ps1" `
            -ArtifactsPath $artifactsPath `
            -EnvironmentName $env:BUILD_ENVIRONMENT_NAME
          Write-Host '##[endgroup]'
        }

    # Preserve partial outputs/checker diagnostics after failures; success-only tag
    # and Release steps below must not publish a failed build as deployable.
    - name: Upload build artifacts
      if: always()
      id: upload-build-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: ${{ github.workspace }}/artifacts/
        retention-days: 90
        overwrite: true
        if-no-files-found: warn

    - name: Upload solution check report
      if: always()
      id: upload-solution-check-report
      uses: actions/upload-artifact@v4
      with:
        name: solution-check-report
        path: ${{ github.workspace }}/artifacts/solution-check/
        retention-days: 90
        overwrite: true
        if-no-files-found: ignore

    # Reruns may reuse a source tag only at the same commit; never move a published
    # BUILD identity to a different source commit.
    - name: Tag source with build version
      id: tag-source
      shell: pwsh
      working-directory: ${{ github.workspace }}/self
      run: |
        $ErrorActionPreference = 'Stop'
        $tagName = $env:BUILD_TAG
        if ($tagName -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[a-z0-9.-]+$') {
          throw "Resolved BUILD tag '$tagName' is not a valid SemVer prerelease tag."
        }
        $tagRef = "refs/tags/$tagName"
        $sourceCommit = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceCommit)) {
          throw "Could not resolve the source commit for build tag '$tagName'."
        }

        git config user.email "${{ github.actor }}@users.noreply.github.com"
        if ($LASTEXITCODE -ne 0) { throw 'git config user.email failed' }
        git config user.name "${{ github.actor }}"
        if ($LASTEXITCODE -ne 0) { throw 'git config user.name failed' }

        $existingTag = @(git ls-remote --tags origin $tagRef "$tagRef^{}" 2>&1)
        if ($LASTEXITCODE -ne 0) {
          throw "Could not query whether build tag '$tagName' already exists."
        }

        if ($existingTag.Count -gt 0) {
          git fetch --force origin "$($tagRef):$tagRef"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing build tag '$tagName'." }
          $existingCommit = (git rev-list -n 1 "$tagName^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($existingCommit)) {
            throw "Could not resolve existing build tag '$tagName' to a commit."
          }
          if ($existingCommit -ine $sourceCommit) {
            throw "Build tag '$tagName' already points to commit '$existingCommit', not '$sourceCommit'. Refusing to overwrite it."
          }
          Write-Host "Build tag '$tagName' already points to this source commit; continuing as an idempotent rerun."
        }
        else {
          git tag -a "$tagName" -m "Build version $env:BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'git tag failed' }
          git push origin "$tagName"
          if ($LASTEXITCODE -ne 0) { throw 'git push tag failed' }
        }

        "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "source_sha=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # Download-ArtifactArchive fetches the uploaded artifact by ID as its ZIP and
    # rejects missing/empty files. Reuse that archive layout as artifacts.zip so
    # Release consumers see the same artifact root as Actions artifact consumers.
    # The checker archive is optional; the deployment archive is mandatory.
    - name: Download artifact archives for GitHub Release
      id: release-assets
      if: success()
      shell: pwsh
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        BUILD_ARTIFACT_ID: ${{ steps.upload-build-artifacts.outputs.artifact-id }}
        SOLUTION_CHECK_ARTIFACT_ID: ${{ steps.upload-solution-check-report.outputs.artifact-id }}
      run: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace($env:BUILD_ARTIFACT_ID)) {
          throw "The BUILD artifact upload did not return an artifact ID."
        }

        $releaseAssetDirectory = Join-Path $env:RUNNER_TEMP 'alm4dataverse-release-assets'
        New-Item -ItemType Directory -Path $releaseAssetDirectory -Force | Out-Null

        function Download-ArtifactArchive {
          param([Parameter(Mandatory)][string]$ArtifactId, [Parameter(Mandatory)][string]$OutputPath)
          $uri = "https://api.github.com/repos/$($env:GH_REPO)/actions/artifacts/$ArtifactId/zip"
          $headers = @{
            Authorization = "Bearer $($env:GH_TOKEN)"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Method Get -Uri $uri -Headers $headers -OutFile $OutputPath
          if (-not (Test-Path -LiteralPath $OutputPath) -or (Get-Item -LiteralPath $OutputPath).Length -eq 0) {
            throw "GitHub returned an empty artifact archive for '$ArtifactId'."
          }
        }

        $artifactsPath = Join-Path $releaseAssetDirectory 'artifacts.zip'
        Download-ArtifactArchive -ArtifactId $env:BUILD_ARTIFACT_ID -OutputPath $artifactsPath
        $reportPath = ''
        if (-not [string]::IsNullOrWhiteSpace($env:SOLUTION_CHECK_ARTIFACT_ID)) {
          $reportPath = Join-Path $releaseAssetDirectory 'solution-check-report.zip'
          Download-ArtifactArchive -ArtifactId $env:SOLUTION_CHECK_ARTIFACT_ID -OutputPath $reportPath
        }
        "artifacts_path=$artifactsPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "solution_check_report_path=$reportPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # The JS block's encoded branch marker and BUILD run/source lines are a machine
    # contract consumed by resolve-deployment.ps1 and deploy-build-validation.ps1.
    # Only this run's existing Release can be updated; only a 404 permits creation.
    # Replace assets by name on rerun, and keep BUILD Releases marked prerelease.
    - name: Create GitHub Release
      id: create-release
      if: success()
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ steps.tag-source.outputs.tag_name }}
        RELEASE_NAME: ${{ steps.resolve-version.outputs.version }}
        BUILD_NAME: ${{ steps.build-number.outputs.run_name }}
        BUILD_VERSION: ${{ steps.resolve-version.outputs.version }}
        BUILD_BRANCH: ${{ inputs.source-branch != '' && inputs.source-branch || github.ref_name }}
        BUILD_SOURCE_SHA: ${{ steps.tag-source.outputs.source_sha }}
        BUILD_RUN_ID: ${{ github.run_id }}
        BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ARTIFACTS_ASSET_PATH: ${{ steps.release-assets.outputs.artifacts_path }}
        SOLUTION_CHECK_REPORT_ASSET_PATH: ${{ steps.release-assets.outputs.solution_check_report_path }}
      with:
        script: |
          const fs = require('fs');
          const tagName = process.env.RELEASE_TAG;
          const branchName = process.env.BUILD_BRANCH;
          const branchMarker = `<!-- alm4dataverse-build-branch:${encodeURIComponent(branchName)} -->`;
          const body = [
            branchMarker,
            `Build: ${process.env.BUILD_NAME}`,
            `Version: ${process.env.BUILD_VERSION}`,
            `Branch: ${branchName}`,
            `Source commit: ${process.env.BUILD_SOURCE_SHA}`,
            `BUILD run: [${process.env.BUILD_RUN_ID}](${process.env.BUILD_RUN_URL})`
          ].join('\n');
          const assets = [
            { path: process.env.ARTIFACTS_ASSET_PATH, name: 'artifacts.zip' },
            { path: process.env.SOLUTION_CHECK_REPORT_ASSET_PATH, name: 'solution-check-report.zip' },
          ].filter(asset => asset.path && fs.existsSync(asset.path));
          if (assets.length === 0) throw new Error('No artifact archives were available for the GitHub Release.');

          let release;
          try {
            release = (await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag: tagName })).data;
            const existingBody = String(release.body || '');
            const runMatch = existingBody.match(/^BUILD run:\s*\[(\d+)\]\s*\(/im);
            const commitMatch = existingBody.match(/^Source commit:\s*(\S+)\s*$/im);
            if (!existingBody.includes(branchMarker) || !runMatch || runMatch[1] !== process.env.BUILD_RUN_ID || (commitMatch && commitMatch[1].toLowerCase() !== process.env.BUILD_SOURCE_SHA.toLowerCase())) {
              throw new Error(`Existing GitHub Release for tag ${tagName} is not owned by this BUILD run.`);
            }
            release = (await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name: process.env.RELEASE_NAME, body, draft: false, prerelease: true })).data;
          }
          catch (error) {
            if (error.status !== 404) throw error;
            release = (await github.rest.repos.createRelease({ owner: context.repo.owner, repo: context.repo.repo, tag_name: tagName, target_commitish: process.env.BUILD_SOURCE_SHA, name: process.env.RELEASE_NAME, body, draft: false, prerelease: true })).data;
          }

          const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, { owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, per_page: 100 });
          for (const asset of assets) {
            const oldAsset = existingAssets.find(item => item.name === asset.name);
            if (oldAsset) await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: oldAsset.id });
            const fileContent = fs.readFileSync(asset.path);
            await github.rest.repos.uploadReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name: asset.name, data: fileContent });
          }
          core.setOutput('release_url', release.html_url);

    # Branch-normalized event types route to branch-specific DEPLOY workflows.
    # Payload SHA/tag/run refer to the build just published, not the receiving
    # workflow's default-branch SHA. Native gh failure must fail this handoff.
    - name: Trigger DEPLOY via repository_dispatch
      shell: pwsh
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN_ID: ${{ github.run_id }}
        BUILD_RUN_NAME: ${{ steps.build-number.outputs.run_name }}
        BUILD_BRANCH: ${{ inputs.source-branch != '' && inputs.source-branch || github.ref_name }}
        BUILD_RELEASE_TAG: ${{ steps.tag-source.outputs.tag_name }}
        BUILD_SOURCE_SHA: ${{ steps.tag-source.outputs.source_sha }}
        BUILD_EVENT: ${{ github.event_name }}
      run: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
          throw 'No token available for repository dispatch.'
        }

        if ([string]::IsNullOrWhiteSpace($env:BUILD_SOURCE_SHA)) {
          throw 'Failed to resolve source commit SHA for repository_dispatch payload.'
        }

        $eventBranchToken = ([string]$env:BUILD_BRANCH).ToLowerInvariant() -replace '[^a-z0-9]+', '-'
        $eventBranchToken = $eventBranchToken.Trim('-')
        if ([string]::IsNullOrWhiteSpace($eventBranchToken)) {
          throw "Failed to resolve branch token for repository_dispatch event type from branch '$($env:BUILD_BRANCH)'."
        }

        $eventType = "alm4dataverse-build-deploy-$eventBranchToken"
        $payload = @{
          event_type = $eventType
          client_payload = @{
            branch         = $env:BUILD_BRANCH
            sha            = $env:BUILD_SOURCE_SHA
            build_run_id   = $env:BUILD_RUN_ID
            build_run_name = $env:BUILD_RUN_NAME
              release_tag    = $env:BUILD_RELEASE_TAG
            build_run_url  = "https://github.com/$($env:GH_REPO)/actions/runs/$($env:BUILD_RUN_ID)"
            build_event    = $env:BUILD_EVENT
            dispatched_at  = (Get-Date).ToUniversalTime().ToString('o')
          }
        } | ConvertTo-Json -Depth 10 -Compress

        $result = @($payload | & gh api --method POST "repos/$($env:GH_REPO)/dispatches" --input - 2>&1)
        if ($LASTEXITCODE -ne 0) {
          $errorText = @($result | ForEach-Object { [string]$_ }) -join "`n"
          throw "Failed to send repository_dispatch event: $errorText"
        }

        Write-Host 'repository_dispatch event sent successfully.'