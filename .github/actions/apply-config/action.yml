# Applies committed alm-config.psd1 settings by running the matching shared setup
# entrypoint and opening a pull request with the regenerated caller workflows.
# The action and the setup source share one checkout ref, so this caller has no
# version-dependent content and the APPLY-CONFIG stub never needs regenerating.
name: Apply Config
description: Regenerate caller workflows from alm-config.psd1 and commit the changes.

inputs:
  repository:
    description: Application repository as owner/name; defaults to the running workflow's repository.
    required: false
  github-token:
    description: Token used to clone and push the application repository and open the pull request. Optional; when omitted the run's GITHUB_TOKEN is used. GitHub blocks that token from changing .github/workflows, so those files are placed in replace-github-workflows/ in the pull request. They are uploaded as the apply-config-files artifact only if the pull request cannot be created.
    required: false
  preview:
    description: When true, shows the changes that would be committed without pushing them.
    required: false
    default: 'false'
  shared-repository:
    description: Shared ALM4Dataverse repository that contains this action and the setup source.
    required: true
  shared-ref:
    description: Shared ALM4Dataverse ref to check out for the setup source.
    required: true

runs:
  using: composite
  steps:
    # self is the caller's repository for the job environment; implementation is
    # taken from this action's own checkout.
    - name: Checkout application repository
      uses: actions/checkout@v4
      with:
        path: application
        fetch-depth: 0

    - name: Checkout shared ALM4Dataverse source
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token || github.token }}
        repository: ${{ inputs.shared-repository }}
        ref: ${{ inputs.shared-ref }}
        path: shared

    - name: Apply configuration and commit changes
      shell: pwsh
      working-directory: ${{ github.workspace }}/shared
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        # Composite action inputs are not exposed to run steps as INPUT_* variables,
        # so map the inputs the script reads explicitly. An empty repository input
        # falls back to the running workflow's repository.
        APPLY_CONFIG_REPOSITORY: ${{ inputs.repository || github.repository }}
        APPLY_CONFIG_PREVIEW: ${{ inputs.preview }}
        APPLY_CONFIG_ARTIFACT_DIR: ${{ runner.temp }}/apply-config-files
      run: |
        $ErrorActionPreference = 'Stop'
        # Setup clones a disposable application copy and pushes with plain git, so
        # authenticate git itself in addition to gh. Keep the header process-scoped
        # so reusable runners do not retain the supplied token.
        git config --global user.name 'ALM4Dataverse Setup'
        git config --global user.email 'setup@alm4dataverse.local'
        $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
        $gitConfigNames = @('GIT_CONFIG_COUNT', 'GIT_CONFIG_KEY_0', 'GIT_CONFIG_VALUE_0')
        $previousGitConfig = @{}
        foreach ($name in $gitConfigNames) {
            $previousGitConfig[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
        }
        try {
            $env:GIT_CONFIG_COUNT = '1'
            $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
            $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
            if ($env:APPLY_CONFIG_PREVIEW -eq 'true') {
                & ./setup-github.ps1 -ApplyConfig -PreviewOnly -RepositoryFullName $env:APPLY_CONFIG_REPOSITORY
            }
            else {
                & ./setup-github.ps1 -ApplyConfig -Commit -RepositoryFullName $env:APPLY_CONFIG_REPOSITORY
            }
        }
        finally {
            foreach ($name in $gitConfigNames) {
                [Environment]::SetEnvironmentVariable($name, $previousGitConfig[$name], 'Process')
            }
        }

    # Runs even when the apply step fails. The folder exists only when the pull request
    # could not be created, so the workflow files that were not applied stay downloadable.
    - name: Upload generated workflow files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apply-config-files
        path: ${{ runner.temp }}/apply-config-files
        # Keeps the .github/ folder, which upload-artifact skips by default.
        include-hidden-files: true
        if-no-files-found: ignore
