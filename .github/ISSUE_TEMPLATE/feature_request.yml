name: Feature request
description: Suggest a change to the shared automation, setup or documentation.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How you would like ALM4Dataverse to behave. Include configuration or caller examples if helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could configuration, a hook or a fork's defaults solve this? What did you try?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Azure DevOps
        - GitHub Actions
        - Setup scripts
        - Documentation
    validations:
      required: true
