parameters:
- name: useAlm4DataverseExtension
  type: boolean
  default: true
- name: buildEnvironmentName
  type: string
  default: ''

stages:
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildJob
        pool: 
          vmImage: windows-2022
        displayName: 'Build'
        timeoutInMinutes: 360  # maximum allowed on Microsoft-hosted agents (free and paid)
        variables:
          - ${{ if ne(parameters.buildEnvironmentName, '') }}:
            - group: 'Environment-${{ parameters.buildEnvironmentName }}'
        steps:
        - checkout: self
          persistCredentials: true
          fetchDepth: 1
          displayName: 'Checkout Source Code'
          path: self
        - checkout: ALM4Dataverse
          fetchDepth: 1
          displayName: 'Checkout ALM Templates Repository'
          path: alm


        - pwsh: |
            $ErrorActionPreference = 'Stop'
            . "$(Pipeline.Workspace)/alm/pipelines/scripts/common.ps1"
            $config = Get-AlmConfig -BaseDirectory "$(Pipeline.Workspace)/self" -LogConfig $false
            $version = Resolve-AlmBuildVersion `
              -Config $config `
              -BranchName "$(Build.SourceBranch)" `
              -RunNumber "$(Build.BuildId)" `
              -Provider azdo
            Write-Host "##vso[build.updatebuildnumber]$(Build.Repository.Name)-$($version.Version)"
            Write-Host "##vso[task.setvariable variable=BuildSemVer]$($version.Version)"
            Write-Host "##vso[task.setvariable variable=BuildSemVerTag]$($version.TagName)"
            Write-Host "Resolved BUILD version $($version.Version)"
          displayName: 'Resolve BUILD SemVer and set run name'

        - task: PowerPlatformToolInstaller@2
          displayName: 'Install Power Platform Tools'
          inputs:
            AddToolsToPath: false

        - ${{ if ne(parameters.buildEnvironmentName, '') }}:
          - ${{ if eq(parameters.useAlm4DataverseExtension, true) }}:
            - task: ALM4Dataverse.alm4dataverse-azdo-extensions.alm4dataverse-set-connection-variables.ALM4DataverseSetConnectionVariables@1
              displayName: 'Set Connection Variables'
              name: ALM4DataverseSetConnectionVariables
              inputs:
                authenticationType: 'PowerPlatformSPN'
                PowerPlatformSPN: ${{ parameters.buildEnvironmentName }}

          - ${{ if ne(parameters.useAlm4DataverseExtension, true) }}:
            - task: microsoft-IsvExpTools.PowerPlatform-BuildTools.set-connection-variables.PowerPlatformSetConnectionVariables@2
              displayName: 'Set Connection Variables'
              name: PowerPlatformSetConnectionVariables
              inputs:
                authenticationType: 'PowerPlatformSPN'
                PowerPlatformSPN: ${{ parameters.buildEnvironmentName }}

          - pwsh: |
              & "$(Pipeline.Workspace)/alm/pipelines/scripts/installdependencies.ps1"

              $environmentUrl = '$(ALM4DataverseSetConnectionVariables.EnvironmentUrl)'
              if ([string]::IsNullOrWhiteSpace($environmentUrl) -or $environmentUrl -match '^\$\(.+\)$') {
                $environmentUrl = '$(BuildTools.EnvironmentUrl)'
              }
              if ([string]::IsNullOrWhiteSpace($environmentUrl) -or $environmentUrl -match '^\$\(.+\)$') {
                throw "Environment URL could not be resolved from the selected connection variables task. Ensure the Power Platform service connection is configured correctly."
              }

              $useAlm4DataverseExtension = '${{ parameters.useAlm4DataverseExtension }}' -eq 'true'
              if (-not $useAlm4DataverseExtension) {
                function Resolve-ConnectionVariable {
                  param([string[]]$Candidates)

                  foreach ($candidate in $Candidates) {
                    if (-not [string]::IsNullOrWhiteSpace($candidate) -and $candidate -notmatch '^\$\(.+\)$') {
                      return $candidate
                    }
                  }

                  return $null
                }

                $resolvedClientId = Resolve-ConnectionVariable @(
                  $env:AZURE_CLIENT_ID
                  '$(PowerPlatformSetConnectionVariables.BuildTools.ApplicationId)'
                  '$(BuildTools.ApplicationId)'
                )
                $resolvedTenantId = Resolve-ConnectionVariable @(
                  $env:AZURE_TENANT_ID
                  '$(PowerPlatformSetConnectionVariables.BuildTools.TenantId)'
                  '$(BuildTools.TenantId)'
                )
                $resolvedClientSecret = Resolve-ConnectionVariable @(
                  $env:AZURE_CLIENT_SECRET
                  '$(PowerPlatformSetConnectionVariables.BuildTools.ClientSecret)'
                  '$(BuildTools.ClientSecret)'
                )

                if ([string]::IsNullOrWhiteSpace($resolvedClientId) -or [string]::IsNullOrWhiteSpace($resolvedTenantId) -or [string]::IsNullOrWhiteSpace($resolvedClientSecret)) {
                  throw "Service principal credentials could not be resolved from Set Connection Variables task outputs. Verify the Power Platform service connection and task output variable names."
                }

                $env:AZURE_CLIENT_ID = $resolvedClientId
                $env:AZURE_TENANT_ID = $resolvedTenantId
                $env:AZURE_CLIENT_SECRET = $resolvedClientSecret
              }

              & "$(Pipeline.Workspace)/alm/pipelines/scripts/connect.ps1" -Url $environmentUrl

              & "$(Pipeline.Workspace)/alm/pipelines/scripts/build.ps1" `
                -SourceDirectory "$(Pipeline.Workspace)/self" `
                -ArtifactStagingDirectory "$(Build.ArtifactStagingDirectory)"
            displayName: 'Install Dependencies, Connect and Build artifacts'
            workingDirectory: '$(Pipeline.Workspace)/self'
            env:
              BUILD_VALIDATION_ENVIRONMENT_NAME: ${{ parameters.buildEnvironmentName }}
              ${{ if eq(parameters.useAlm4DataverseExtension, true) }}:
                AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ${{ if ne(parameters.useAlm4DataverseExtension, true) }}:
                AZURE_CLIENT_ID: $(PowerPlatformSetConnectionVariables.BuildTools.ApplicationId)
                AZURE_TENANT_ID: $(PowerPlatformSetConnectionVariables.BuildTools.TenantId)
                AZURE_CLIENT_SECRET: $(PowerPlatformSetConnectionVariables.BuildTools.ClientSecret)

        - ${{ if eq(parameters.buildEnvironmentName, '') }}:
          - pwsh: |
              & "$(Pipeline.Workspace)/alm/pipelines/scripts/installdependencies.ps1"
              & "$(Pipeline.Workspace)/alm/pipelines/scripts/build.ps1" `
                -SourceDirectory "$(Pipeline.Workspace)/self" `
                -ArtifactStagingDirectory "$(Build.ArtifactStagingDirectory)"
            displayName: 'Install Dependencies and Build artifacts'
            workingDirectory: '$(Pipeline.Workspace)/self'

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            . "$(Pipeline.Workspace)/alm/pipelines/scripts/common.ps1"
            $config = Get-AlmConfig -BaseDirectory "$(Pipeline.Workspace)/self" -LogConfig $false
            $version = Resolve-AlmBuildVersion `
              -Config $config `
              -BranchName "$(Build.SourceBranch)" `
              -RunNumber "$(Build.BuildId)" `
              -Provider azdo
            Write-AlmBuildVersionInfo `
              -ArtifactsPath "$(Build.ArtifactStagingDirectory)" `
              -BuildVersion $version `
              -RunId "$(Build.BuildId)" `
              -SourceCommit "$(Build.SourceVersion)"
          displayName: 'Record BUILD version metadata'

        - ${{ if ne(parameters.buildEnvironmentName, '') }}:
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              & "$(Pipeline.Workspace)/alm/pipelines/scripts/resolvebuildvalidationbaseline.ps1" `
                -ConfigPath "$(Build.ArtifactStagingDirectory)/alm-config.psd1" `
                -SourceDirectory "$(Pipeline.Workspace)/self" `
                -CollectionUri "$(System.CollectionUri)" `
                -Project "$(System.TeamProject)" `
                -DefinitionId "$(System.DefinitionId)" `
                -AccessToken $env:SYSTEM_ACCESSTOKEN
            displayName: 'Resolve BUILD validation baseline'
            workingDirectory: '$(Pipeline.Workspace)/self'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download BUILD validation baseline artifacts'
            condition: and(succeeded(), ne(variables['BuildValidationBaselineBuildId'], ''))
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(System.DefinitionId)'
              buildVersionToDownload: 'specific'
              pipelineId: '$(BuildValidationBaselineBuildId)'
              artifactName: 'artifacts'
              targetPath: '$(Pipeline.Workspace)/build-validation-baseline'

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              & "$(Pipeline.Workspace)/alm/pipelines/scripts/installdependencies.ps1"

              $environmentUrl = '$(ALM4DataverseSetConnectionVariables.EnvironmentUrl)'
              if ([string]::IsNullOrWhiteSpace($environmentUrl) -or $environmentUrl -match '^\$\(.+\)$') {
                $environmentUrl = '$(BuildTools.EnvironmentUrl)'
              }
              if ([string]::IsNullOrWhiteSpace($environmentUrl) -or $environmentUrl -match '^\$\(.+\)$') {
                throw 'Environment URL could not be resolved from the selected connection variables task.'
              }

              $useAlm4DataverseExtension = '${{ parameters.useAlm4DataverseExtension }}' -eq 'true'
              if (-not $useAlm4DataverseExtension) {
                function Resolve-ConnectionVariable {
                  param([string[]]$Candidates)
                  foreach ($candidate in $Candidates) {
                    if (-not [string]::IsNullOrWhiteSpace($candidate) -and $candidate -notmatch '^\$\(.+\)$') {
                      return $candidate
                    }
                  }
                  return $null
                }

                $resolvedClientId = Resolve-ConnectionVariable @(
                  $env:AZURE_CLIENT_ID
                  '$(PowerPlatformSetConnectionVariables.BuildTools.ApplicationId)'
                  '$(BuildTools.ApplicationId)'
                )
                $resolvedTenantId = Resolve-ConnectionVariable @(
                  $env:AZURE_TENANT_ID
                  '$(PowerPlatformSetConnectionVariables.BuildTools.TenantId)'
                  '$(BuildTools.TenantId)'
                )
                $resolvedClientSecret = Resolve-ConnectionVariable @(
                  $env:AZURE_CLIENT_SECRET
                  '$(PowerPlatformSetConnectionVariables.BuildTools.ClientSecret)'
                  '$(BuildTools.ClientSecret)'
                )
                if ([string]::IsNullOrWhiteSpace($resolvedClientId) -or
                    [string]::IsNullOrWhiteSpace($resolvedTenantId) -or
                    [string]::IsNullOrWhiteSpace($resolvedClientSecret)) {
                  throw 'Service principal credentials could not be resolved for BUILD validation deployment.'
                }
                $env:AZURE_CLIENT_ID = $resolvedClientId
                $env:AZURE_TENANT_ID = $resolvedTenantId
                $env:AZURE_CLIENT_SECRET = $resolvedClientSecret
              }

              & "$(Pipeline.Workspace)/alm/pipelines/scripts/connect.ps1" -Url $environmentUrl

              $baselineBuildId = '$(BuildValidationBaselineBuildId)'
              if (-not [string]::IsNullOrWhiteSpace($baselineBuildId) -and $baselineBuildId -notmatch '^\$\(.+\)$') {
                $baselineArtifactsPath = '$(Pipeline.Workspace)/build-validation-baseline'
                $baselineDeployScript = Join-Path $baselineArtifactsPath 'alm/pipelines/scripts/deploy.ps1'
                if (-not (Test-Path -LiteralPath $baselineDeployScript)) {
                  throw "Downloaded baseline run '$baselineBuildId' does not contain the expected deployment script."
                }
                Write-Host "##[section]Deploying baseline BUILD run $baselineBuildId to the BUILD validation environment"
                & $baselineDeployScript -ArtifactsPath $baselineArtifactsPath
              }

              Write-Host '##[section]Deploying candidate build artifacts to the BUILD validation environment'
              & "$(Build.ArtifactStagingDirectory)/alm/pipelines/scripts/deploy.ps1" `
                -ArtifactsPath "$(Build.ArtifactStagingDirectory)"
            displayName: 'Deploy baseline and candidate to BUILD validation environment'
            workingDirectory: '$(Build.ArtifactStagingDirectory)'
            env:
              ${{ if eq(parameters.useAlm4DataverseExtension, true) }}:
                AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ${{ if ne(parameters.useAlm4DataverseExtension, true) }}:
                AZURE_CLIENT_ID: $(PowerPlatformSetConnectionVariables.BuildTools.ApplicationId)
                AZURE_TENANT_ID: $(PowerPlatformSetConnectionVariables.BuildTools.TenantId)
                AZURE_CLIENT_SECRET: $(PowerPlatformSetConnectionVariables.BuildTools.ClientSecret)

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Artifacts'
          condition: succeededOrFailed()
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)'
            artifact: 'artifacts'

        - pwsh: |
            if (Test-Path "$(Build.ArtifactStagingDirectory)/solution-check") {
              Write-Host "##vso[task.setvariable variable=HasSolutionCheckReport]true"
              Write-Host "Solution check report folder detected."
            } else {
              Write-Host "##vso[task.setvariable variable=HasSolutionCheckReport]false"
              Write-Host "No solution check report folder found."
            }
          displayName: 'Detect Solution Check Report'
          condition: succeededOrFailed()

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Solution Check Report'
          condition: and(succeededOrFailed(), eq(variables['HasSolutionCheckReport'], 'true'))
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/solution-check'
            artifact: 'solution-check-report'

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $tagName = '$(BuildSemVerTag)'
            if ($tagName -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[a-z0-9.-]+$') {
              throw "Resolved BUILD tag '$tagName' is not a valid SemVer prerelease tag."
            }
            Write-Host "Tagging source repository with build version $(BuildSemVer)"
            git config user.email "$(Build.RequestedForEmail)"
            if ($LASTEXITCODE -ne 0) { throw "git config user.email failed with exit code $LASTEXITCODE" }
            git config user.name "$(Build.RequestedFor)"
            if ($LASTEXITCODE -ne 0) { throw "git config user.name failed with exit code $LASTEXITCODE" }
            $sourceCommit = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceCommit)) {
              throw "Could not resolve source commit for BUILD tag '$tagName'."
            }
            $existingRefs = @(git ls-remote --tags origin "refs/tags/$tagName" "refs/tags/$tagName^{}" 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Could not query existing BUILD tag '$tagName'." }
            if ($existingRefs.Count -gt 0) {
              git fetch --force origin "refs/tags/${tagName}:refs/tags/${tagName}"
              if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing BUILD tag '$tagName'." }
              $existingCommit = (git rev-list -n 1 "$tagName^{commit}").Trim()
              if ($LASTEXITCODE -ne 0 -or $existingCommit -ine $sourceCommit) {
                throw "BUILD tag '$tagName' already points to a different source commit."
              }
              Write-Host "BUILD tag '$tagName' already points to this source commit; continuing as an idempotent rerun."
            }
            else {
              git tag -a "$tagName" -m "Build version $(BuildSemVer)"
              if ($LASTEXITCODE -ne 0) { throw "git tag failed with exit code $LASTEXITCODE" }
              git push origin "$tagName"
              if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
            }
          displayName: 'Tag Source with Build Version'
          workingDirectory: '$(Pipeline.Workspace)/self'
